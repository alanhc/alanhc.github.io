# Builds the Hugo site, gates it on preflight + link checking, and deploys to
# GitHub Pages. Pull requests run the build and both gates but never deploy --
# see the `if:` guards on the upload step and the deploy job.
name: Build and deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Validate pull requests too. Without this, preflight.sh and lychee only ever
  # ran after merge, so a PR could not be verified before it landed -- broken
  # links and a failing build were only discovered on main.
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Production deployments keep the original behaviour: one at a time, never
# cancelled, so a deploy always runs to completion.
# Pull requests get their own group per PR and DO cancel superseded runs --
# otherwise pushing twice to a PR would queue a second full build behind the
# first, and PR validation would also serialise against production deploys.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Preflight
        run: ./scripts/preflight.sh ./public
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline 只驗證本地檔案、不發任何網路請求，
          # 所以外部網站掛掉不會造成假紅燈。
          args: --offline --no-progress --root-dir "$(pwd)/public" './public/**/*.html'
          fail: true
      # Only needed for deployment, and a PR must not produce a deployable
      # artifact -- the build above plus the two gates are the whole point of
      # running this on a pull request.
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job. Skipped entirely on pull requests.
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
