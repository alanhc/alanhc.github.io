del achieved an average accuracy of 94.8% on a dataset of 160,000 simulated signals. The model can distinguish between different tremor frequencies with an accuracy of 94.14% and 95.42%, respectively.","demo":"","github":"","video":"","screenshot":["image/projects/trembling.png"]}},{"title":"Adaptive Driving Beam System","image":"image/projects/adb.png","tags":["select","AI"],"tech":["example"],"modal":{"title":"Adaptive Driving Beam System based on Deep Learning and Image Enhancement","description":"Developed an Adaptive Driving Beam Headlamp (ADB) system using deep learning techniques for nighttime vehicle detection. This project integrates recent research in computer vision and image enhancement to improve nighttime driving safety.","demo":"","github":"","video":"uoV21i9NB98"}},{"title":"Change My Style","image":"image/projects/cce-demo.png","tags":["select","AI"],"tech":["example"],"modal":{"title":"","description":"Developed a machine learning inference API using FastAPI and Tensorflow. The API takes an image as input and returns the predicted class label. The API was built using FastAPI, a modern Python framework for building APIs. Tensorflow was used to load and run the machine learning model. Built a client application using Tkinter and OpenCV to interact with the API. The client application allows users to upload images and view the predicted class label. The client application was built using Tkinter, a Python GUI toolkit. OpenCV was used to load and display the images.","demo":"","github":"","video":"","screenshot":["image/projects/cce-demo.png"]}},{"title":"AlgViz","image":"image/projects/alg.png","tags":["select"],"tech":["example"],"modal":{"title":"","description":"Implemented algorithms including AVL Trees, Binary Search Trees, Dijkstra's algorithm, Kruskal's algorithm, Max Heaps, multiple sorting algorithms, and Topological Sort, and visualized the structures and time complexities of different sorting algorithms.","demo":"","github":"","video":""}}, ["blockchain"],"tech":["Solidity","Python","Algorithm"],"modal":{"title":"Vaccine Tracking System"},"content":"- `Solidity`,` Python`, `Algorithm`\n- Developed a blockchain-based vaccine tracking system utilizing Bloom Filter for efficient and rapid vaccine batch number verification with lower time complexity O(k) and space complexity O(m).\n- [slide](https://drive.google.com/file/d/1DobizU6Q7WaxK8KtlDEA8Q_hvze9X3MX/view?usp=sharing) [article](https://medium.com/@alanhc/%E4%BD%BF%E7%94%A8bloom-filter%E5%8F%8Aweb3-py%E4%BE%86%E5%81%9A%E7%96%AB%E8%8B%97%E8%AA%8D%E8%AD%89-ntu-dapp-%E6%9C%9F%E4%B8%ADprototype-4493ba5425e9)[demo](https://youtu.be/oaXrKvUwzuU?si=oBhAFCJos0rFzcCp)"},{"id":"trending_post","title":"Dcard trending post prediction","image":null,"tags":["AI"],"tech":["SQL","Machine Learning","Data Analysis"],"modal":{"title":"Dcard trending post prediction"},"content":"- `SQL`, `Machine Learning`, `Data Analysis`\n- Developed a data pipeline to predict popular Dcard posts using SQL, scikit-learn, MySQL, and matplotlib.\n- Cleaned and analyzed Dcard data to identify key features for predicting popularity.\n- [repo](https://github.com/alanhc/Data-intern)[demo](https://youtu.be/CoGo9ygEv8g?si=2dwi26LcBSEFKV7M)"},{"id":"tremor_research","title":"Early Detection of Human Tremor Symptoms","image":"image/projects/trembling.png","tags":["select","AI"],"tech":["Tensorflow","LSTM/RNN","Python"],"modal":{"title":"Early Detection of Human Tremor Symptoms and Home Care Services Based on Video and Deep Learning"},"content":"- Developed an LSTM-RNN model using Tensorflow Functional API to distinguish between patient tremor frequency and noise.\n- The model achieved an average accuracy of 94.8% on a dataset of 160,000 simulated signals.\n- The model can distinguish between different tremor frequencies with an accuracy of 94.14% and 95.42%, respectively.\n- [repo](https://github.com/alanhc/Trembling-research)"},{"id":"smart_recommended_shelves","title":"Smart Recommended Shelves","image":null,"tags":["AI"],"tech":["Arduino","Computer Vision","Deep Learning","Embedded Systems","C/C++","Python","OpenCV","CNN"],"modal":{"title":"Smart Recommended Shelves"},"content":"- `Arduino`, `Computer vision`, `Deep Learning`, `Embedded systems`, `C/C++`, `Python`, `OpenCV`, `CNN`\n- Developed a smart shelf system to help indecisive customers make purchasing decisions. \n- Used OpenCV to capture facial images and CNN to determine the customer's gaze direction.\n- Controlled the smart shelf using Firmata protocol.\n- [repo](https://github.com/alanhc/NTU-Hackathon)"},{"id":"secure_ticketing","title":"Secure NFT Ticketing System","image":"image/projects/secureticketing.png","tags":["select","blockchain","web","security"],"tech":["NextJS","PWA","NFT","Tezos","FastAPI","Steganography","Homomorphic encryption"],"modal":{"title":"NFT Ticketing"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/ZYo51JMlp5Y\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n- `FastAPI`, `Python`, `Security`, `Tezos`, `Steganography`, `Homomorphic encryption`\n- Designed and implemented the backend API services for the ticketing system, including authentication, ticketing, and data services.\n- Used Python, FastAPI, and MongoDB to build the system.\n- Applied homomorphic encryption and steganography to create secure QR codes.\n- [video presentation](https://youtu.be/ZYo51JMlp5Y?si=W5Qu15XELBiIgeA1) [repo](https://github.com/alanhc/MMS-final)[slide](https://docs.google.com/presentation/d/1lk0xQHnsjB65QLTBPieeLBeJevVj29rIhPuMBVP9fcY/edit?usp=sharing)[demo](https://alanhc.github.io/MMS-final)[report](https://docs.google.com/document/d/1CsYlKoOb9UpLX7HF96b25ZuWQ3eGAz1lYAr-OLc6aZo/edit?usp=sharing)\n"},{"id":"rate_my_professor","title":"Rate My Professors TW","image":null,"tags":["web"],"tech":["NodeJS","MVC","Mongodb","SSR","SSG","JWT","NextJS","FastAPI","CI/CD","Github Auction","Progressive Web App","Web Crawling","CRUD","Express","Authentication"],"modal":{"title":"Rate My Professors TW"},"content":"- School-up\n  - `NextJS`, `SSG`, `FastAPI`, `Mongodb`, `JWT`, `CI/CD`, `Github Action`, `Progressive Web App`, `Web Crawling`\n  - Efficiently crawled course information from MCU-up and the school's course page using asyncio and aiohttp, reducing the crawling time by 83%.\n  - Built a course scheduler and course rating system using NextJS, and implemented a REST API with FastAPI and MongoDB.\n  - [demo](https://next-school-up.vercel.app/)\n- MCU-up\n  - `NodeJS`, `MVC`, `CRUD`, `Express`, `Authentication`, `Server-Side Rendering`, `MongoDB`\n  - MCU-up is a review site using MVC pattern, NodeJS, and Express from scratch with Authentication, CRUD, and Server-Side Rendering.\n  - Led a team of 5 developers and designers to develop the application.\n  - The application has been used by over 1,000 students.\n  - [article](https://medium.com/@alanhc/%E9%96%8B%E7%99%BCmcu-up-%E9%8A%98%E5%82%B3%E9%87%91%E6%89%8B%E6%8C%873-0-%E7%9A%84%E9%82%A3%E4%BA%9B%E4%BA%8B%E5%85%92-5214e62aca80)"},{"id":"posenet_dino","title":"Chrome Dino Jumper","image":"image/projects/dino.png","tags":["web","select"],"tech":["tensorflow","Javascript","p5JS"],"modal":{"title":"dino-posenet"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/rE01xxdUTdY\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `Pose Estimation`, `Deep learning`, `Computer vision`, `Machine learning`, `JavaScript`, `p5.js`\n- Using Posenet and modifying repo from source detecting human motions to control chrome dinosaurs.\n- Modified the source code of the Chrome Dino Runner game to add a pose-based jumping mechanic.\n- Used the PoseNet model from ml5.js to track the player's pose.\n- Used the p5 Vector class from p5.js to calculate the dinosaur's jump trajectory.\n- [repo](https://github.com/alanhc/dino-posenet) [demo](https://youtu.be/rE01xxdUTdY?si=WGWayA9oaVGflc5u)\n"},{"id":"opengl_robot","title":"OpenGL Dancing Robot","image":"image/projects/dancingrobot.png","tags":["mobile"],"tech":["OpenGL","C++","OpenCV"],"modal":{"title":"OpenGL Dancing Robot"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/1JbuL0aO4-s\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `C/C++`, `OpenGL`, `OpenCV`, `Computer Graphics`, `Model Control`, `Animation`\n- Got First place in the Computer graphics final project in a collective vote of 52 people.\n- Implemented a model control system in OpenGL, enabling a robot to jump, inspired by Maya's graphical model control system.\n- Utilized computer graphics concepts such as alpha, model import, and coordinate movement.\n- [video demo](https://youtu.be/1JbuL0aO4-s?si=4cy5YXy6M_6jiA_E) [repo](https://github.com/alanhc/OpenGL-Dancing-robot)"},{"id":"ntu_matches","title":"NTU Matches","image":null,"tags":["web"],"tech":["NextJS","Vector Database"],"modal":{"title":"NTU Matches"},"content":"- [demo](https://ntu-matches.vercel.app/)\n- pairing (vector database) ([WIP](/logA/posts/20231217-ntu-matches)) "},{"id":"money_sea","title":"Money-Sea Crisis","image":"image/projects/Money-Sea-Crisis.png","tags":["mobile"],"tech":["Unity","C#","Game development"],"modal":{"title":"sea level rise"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/vm1mut6qMHA\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `C#`, `Unity`, `Game development`\n- Developed a game for the NASA Hackathon to raise awareness of the impact of global warming.\n- Used Unity to create a game that combines a Monopoly-like land-buying mechanic with a quiz to teach players about climate change.\n- The game allows players to experience the effects of sea level rise firsthand and earn money by answering questions correctly.\n- [project page](https://2019.spaceappschallenge.org/challenges/earths-oceans/rising-water/teams/athena-mark-iii/project)[repo](https://github.com/alanhc/nasaspaceapp2019)"},{"id":"landing_plant","title":"Landing Planet","image":"image/projects/landing.png","tags":["mobile"],"tech":["Java","Physical Simulation","Android"],"modal":{"title":"Landing Planet"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/sISmhfmjx60\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `Java`, `Physical Simulation`, `Android`\n- Received Second Place by collective vote (50 participants) for developing a space exploration game using Java and \"Computer Graphics\" concepts. Inspired by [Mars: Mars](https://www.youtube.com/watch?v=gImaYwpEc2I), the game utilizes Java Processing to create immersive visuals and interactions, featuring physics simulations (gravity, landing) and particle effects (spaceship thrust, landing). An Android version of the game is also available.\n- [repo](https://github.com/alanhc/LANDING-PLANET) [demo](https://youtu.be/sISmhfmjx60?si=-8A1ImDFJyljrhfh)"},{"id":"fanstick","title":"FansTick","image":null,"tags":["blockchain","web"],"tech":["React Native"],"modal":{"title":"Decentralized showroom"},"content":"TBD"},{"id":"fake_news","title":"Fake News Hunter","image":"image/projects/cofacts.png","tags":["web"],"tech":["Chrome Extension","GCP","Python","Flask"],"modal":{"title":"Fake News Hunter"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/JxxwyeFB45s\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `Chrome Extension`, `GCP`, `Python`, `Flask`, `GCP`\n- Developed a Chrome extension to combat fake news, integrating with g0v's Cofacts API. The extension utilizes the Flask backend and leverages GCP's Cloud Function server for scalability and efficiency.\n- [repo](https://github.com/alanhc/SC-cofacts-extension) [demo](https://youtu.be/JxxwyeFB45s?si=Xwde4iaXXdjsr3y9)"},{"id":"drumio","title":"drum.io","image":"image/projects/drum.png","tags":["web","AI"],"tech":["Socket Programming","Arduino","KNN","C/C++","NodeJS","Tensorflow.js","socket.io","JavaScript"],"modal":{"title":"drum.io"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/82d7E0uENcg\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `socket Programming`, `Arduino`, `KNN`, `C/C++`, `NodeJS`, `KNN(ml5.js)`, `socket.io`, `JavaScript`\n- Awarded 1st place in Interactive Media Programming (52 participants) and 3rd place by collective vote (50 participants) for developing a multiplayer interactive game combining machine learning and hardware. Inspired by [Chrome Music Lab](https://musiclab.chromeexperiments.com/Experiments), [teachablemachine](https://teachablemachine.withgoogle.com), and [Agar. io](https://agar.io/), the game uses KNN algorithm to analyze acceleration data from an embedded device to create an air drum experience and enable online battles.\n- [repo](https://github.com/alanhc/drum.io)"},{"id":"decentral_showroom","title":"Decentralized showroom","image":"image/projects/showroom.png","tags":["select","AR/VR","blockchain","web"],"tech":["Unity","NFT","FARM stack","FastAPI","Tezos","React","Mongodb"],"modal":{"title":"Decentralized showroom"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/7EPRiUR4XqM?si=5Xg6w1l9K9K0TWkh\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n\n- `FastAPI`, `Tezos`, `React`, `MongoDB`\n- Developed the backend API services for the showroom application, including authorization, room management, and NFT metadata retrieval.\n- Used FastAPI, React, and MongoDB to build the application.\n- Implemented the decentralized authentication mechanism using digital signatures.\n- [article](https://medium.com/@alanhc/decentral-showroom-ntu-dapp-term-project-ce947ea9c792)[repo](https://github.com/DSR-Team)"},{"id":"change_my_style","title":"Change My Style","image":"image/projects/cce-demo.png","tags":["select","AI"],"tech":["FastAPI","Tensorflow","OpenCV","StyleGAN","Tkinter"],"modal":{"title":"Change My Style"},"content":"- `FastAPI`, `Tensorflow`, `OpenCV`, `StyleGAN`, `Tkinter`\n- Developed a machine learning inference API using FastAPI and Tensorflow.\n- Built a client application using Tkinter and OpenCV to interact with the API.\n- [repo](https://github.com/alanhc/cce-demo)"},{"id":"bitcoin_ds","title":"Bitcoin Digital Signature Mechanism Implementation","image":null,"tags":["blockchain"],"tech":["Bitcoin","Python","Sagemath","ECDSA"],"modal":{"title":"Bitcoin Digital Signature Mechanism Implementation"},"content":"- `Blockchain`, `Bitcoin`, `Python`, `Sagemath`, `ECDSA`\n- Implemented the Bitcoin digital signature mechanism using SageMath.\n- The implementation is based on the Elliptic Curve Digital Signature Algorithm (ECDSA), using the secp256k1 elliptic curve and the SHA-256 hash function.\n- [repo](https://github.com/alanhc/fintech-hw3)"},{"id":"bbf","title":"BBF(Blockchain Bloom Filter)","image":"image/projects/bloomfilter.png","tags":["blockchain"],"tech":["Python","solidity","streamlit"],"modal":{"title":"2022 NTU DApp (spring) Midterm Project"},"content":"description: Developed a blockchain-based vaccine tracking system utilizing Bloom Filter for efficient and rapid vaccine batch number verification with lower time complexity O(k) and space complexity O(m).\ndemo: https://medium.com/@alanhc/%E4%BD%BF%E7%94%A8bloom-filter%E5%8F%8Aweb3-py%E4%BE%86%E5%81%9A%E7%96%AB%E8%8B%97%E8%AA%8D%E8%AD%89-ntu-dapp-%E6%9C%9F%E4%B8%ADprototype-4493ba5425e9\ngithub: \"\"\nvideo: oaXrKvUwzuU"},{"id":"algviz","title":"AlgViz","image":"image/projects/alg.png","tags":["select"],"tech":["Algorithm","JavaScript"],"modal":{"title":"AlgViz"},"content":"- `Algorithm`, `JavaScript` \n- Implemented algorithms including AVL Trees, Binary Search Trees, Dijkstra's algorithm, Kruskal's algorithm, Max Heaps, multiple sorting algorithms, and Topological Sort, and visualized the structures and time complexities of different sorting algorithms.\n- [demo](https://alanhc.github.io/algorithm/)[repo](https://github.com/alanhc/algorithm)\n"},{"id":"alanhc","title":"alanhc.github.io","image":"logo.png","tags":["web"],"tech":["NextJS","SSG","TypeScript","chakra UI"],"modal":{"title":"alanhc.github.io"},"content":"- `Static Site Generation`\n- The application uses static site generation (SSG) to speed up page load times and improve SEO.\n- [demo](https://alanhc.github.io/)"},{"id":"adaptive_driving_bean","title":"Adaptive Driving Beam System","image":"image/projects/adb.png","tags":["select","AI"],"tech":["Python","Computer Vision","Numpy","Scikit-Learn","Algorithm","Linear Algebra"],"modal":{"title":"Adaptive Driving Beam System Based on Deep Learning and Image Enhancement"},"content":"\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/uoV21i9NB98\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e\n- Employed Nakagami image conversion, EdgeBox feature extraction, CycleGAN night-to-day conversion, YOLO object detection, and feature fusion with SVM classification.\n- Developed an Adaptive Driving Beam Headlamp system using camera calibration and projection to generate precise light patterns.\n- This project combines the recent DL research and the image enhancement to detect vehicles at night.\n- Achieved an average accuracy of 58.5% and an average recall rate of 59% on a variety of real-world video footage.\n- [paper](https://drive.google.com/file/d/1em8AtK4l_FWx56bJbN6RKJt-5fS9XDeG/view?usp=sharing) [repo1](https://github.com/alanhc/research-beta/) [repo2](https://github.com/alanhc/research) [report-zh](https://drive.google.com/file/d/1EkbihH2L6w98yRqDjIlHwXyLSJRsde8A/view?usp=sharing)\n![Image of adaptive driving beam system](image/projects/adb.png)\n\n\u003ciframe width=\"100%\" height=\"315\" src=\"https://www.youtube.com/embed/uoV21i9NB98\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen\u003e\u003c/iframe\u003e"}],"search_groups":[{"title":"tags","options":["AI","AR/VR","blockchain","mobile","security","select","web"]},{"title":"tech","options":["Algorithm","Android","Arduino","Authentication","Bitcoin","C#","C++","C/C++","CI/CD","CNN","CRUD","Chrome Extension","Computer Vision","Data Analysis","Deep Learning","ECDSA","Embedded Systems","Express","FARM stack","FastAPI","Flask","GCP","Game development","Github Auction","Homomorphic encryption","JWT","Java","JavaScript","Javascript","KNN","LSTM/RNN","Linear Algebra","MVC","Machine Learning","Mongodb","NFT","NextJS","NodeJS","Numpy","OpenCV","OpenGL","PWA","Physical Simulation","Progressive Web App","Python","React","React Native","SQL","SSG","SSR","Sagemath","Scikit-Learn","Socket Programming","Solidity","Steganography","StyleGAN","Tensorflow","Tensorflow.js","Tezos","Tkinter","TypeScript","Unity","Vector Database","Web Crawling","chakra UI","p5JS","socket.io","solidity","streamlit","tensorflow"]}]},"__N_SSG":true},"page":"/projects","query":{},"buildId":"IIg3-xcizwKiU0bDHsFQB","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
